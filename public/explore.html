<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공연 찾기 | Ticket Diary</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/explore.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">Ticket Diary</a>
      <nav>
        <ul class="menu">
          <li><a href="index.html">홈</a></li>
          <li><a class="active" href="explore.html">공연 찾기</a></li>
          <li><a href="diary.html">내 다이어리</a></li>
          <li><a href="summary.html">결산</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="content">
    <div class="filter">
      <label>
        <span>검색</span>
        <input type="search" id="keyword" placeholder="공연명 또는 공연장">
      </label>
    </div>

    <p class="result-count" id="count"></p>
    <ul class="poster-grid" id="grid"></ul>
    <ul class="concert-list hidden" id="list"></ul>
    <button type="button" class="button more-button hidden" id="more">더 보기</button>
  </main>

  <!-- 티켓 추가 창: 공연 목록에서 포스터나 "티켓 추가"를 누르면 active 클래스가 붙어 표시 -->
  <div class="modal" id="modal-box">
    <div class="modal-content">
      <h2 class="modal-title">티켓 추가</h2>

      <div class="selected">
        <div class="poster" id="modal-poster"></div>
        <div class="info">
          <h2 id="modal-name"></h2>
          <p class="detail" id="modal-detail"></p>
        </div>
      </div>

      <div class="field">
        <label for="ticket-date">관람일</label>
        <select id="ticket-date"></select>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="ticket-grade">좌석</label>
          <span class="price" id="ticket-price"></span>
        </div>
        <div class="seat-row">
          <select id="ticket-grade"></select>
          <input type="text" id="ticket-seat" placeholder="예: 1층 B구역 12열 8번">
        </div>
      </div>

      <div class="modal-buttons">
        <button type="button" id="modal-close">닫기</button>
        <button type="button" class="primary" id="modal-add">추가</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>공연 데이터 출처: KOPIS 공연예술통합전산망</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
